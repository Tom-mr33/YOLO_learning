# YOLOv8 验证配置

# 模型配置
model:
  weights: runs/detect/runs/train/exp/weights/best.pt  # 模型权重路径

# 数据配置
data:
  name: coco128.yaml        # 数据集配置文件路径
  path: data/coco128        # 数据集根目录
  val: images/val2017       # 验证集相对路径
  nc: 80                    # 类别数量

# 验证参数
val:
  batch: 32                 # 批次大小
  imgsz: 640                # 输入图片尺寸
  conf: 0.001               # 置信度阈值
  iou: 0.6                  # NMS IoU 阈值
  max_det: 300              # 每张图片最大检测数
  device: 0                 # 验证设备
  workers: 8                # 数据加载线程数
  project: runs/val         # 项目输出目录
  name: exp                 # 实验名称
  exist_ok: false           # 覆盖现有实验
  half: false               # 半精度推理
  dnn: false                # OpenCV DNN 推理
  plots: true               # 生成可视化图表
  save_json: false          # 保存 COCO JSON 结果
  save_hybrid: false        # 保存混合标签
  verbose: true             # 详细输出
  save_txt: false           # 保存 TXT 结果
  save_conf: false          # 保存置信度
  save_crop: false          # 保存裁剪结果
  show_labels: true         # 显示标签
  show_conf: true           # 显示置信度
  vid_stride: 1             # 视频帧步长
  line_width: null          # 边界框线宽
  visualize: false          # 可视化特征
  augment: false            # 增强推理
  agnostic_nms: false       # 类别无关 NMS
  classes: null             # 过滤类别
  retina_masks: false       # 高分辨率掩码
  boxes: true               # 显示边界框
  split: val                # 数据集分割（val/test）
