# YOLOv8 测试配置

# 模型配置
model:
  weights: runs/train/exp/weights/best.pt  # 模型权重路径

# 数据配置
data:
  source: C:/YOLO_learning/data/coco128/images/train2017  # 测试图片/视频路径
  # 支持: 图片路径、视频路径、图片目录、摄像头编号、URL

# 测试参数
test:
  imgsz: 640                # 输入图片尺寸
  conf: 0.25                # 置信度阈值
  iou: 0.45                 # NMS IoU 阈值
  max_det: 1000             # 每张图片最大检测数
  device: 0                 # 测试设备
  view_img: false           # 显示图片
  save_txt: false           # 保存 TXT 结果
  save_conf: false          # 保存置信度
  save_crop: false          # 保存裁剪结果
  save: true                # 保存检测结果
  project: runs/test        # 项目输出目录
  name: exp                 # 实验名称
  exist_ok: false           # 覆盖现有实验
  half: false               # 半精度推理
  dnn: false                # OpenCV DNN 推理
  show_labels: true         # 显示标签
  show_conf: true           # 显示置信度
  vid_stride: 1             # 视频帧步长
  line_width: null          # 边界框线宽
  visualize: false          # 可视化特征
  augment: false            # 增强推理
  agnostic_nms: false       # 类别无关 NMS
  classes: null             # 过滤类别
  retina_masks: false       # 高分辨率掩码
  boxes: true               # 显示边界框
  stream: false             # 流式推理
  verbose: true             # 详细输出
