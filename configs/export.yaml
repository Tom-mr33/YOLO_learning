# YOLOv8 导出配置

# 模型配置
model:
  weights: runs/detect/train/exp/weights/best.pt  # 模型权重路径

# 导出参数
export:
  project: export          # 项目输出目录
  name: exp                 # 实验名称
  imgsz: 640                # 输入图片尺寸
  half: false               # 是否使用半精度
  dynamic: false            # 是否使用动态轴
  simplify: true            # 是否简化 ONNX 模型
  opset: 12                 # ONNX opset 版本
  workspace: 4              # TensorRT 工作空间大小 (GB)
  nms: false                # 是否包含 NMS
